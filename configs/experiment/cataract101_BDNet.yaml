# Cataract-101 × BDNet
model_name: BDNet
sampling:
  fps: 2.5
model:
  name: BDNet
  max_len: 20.0
  n_members: 5
  n_phases: 11
  n_experience: 2
  use_experience: true
  fps: 2.5
  frame_pool: .cache/catanet_cataract101/pool
is_baseline: false
batch_size: 1
weight_decay: 0.0
stages:
  cnn_epochs: 20
  cnn_patience: 10
  cnn_lr: 1.0e-4
  cnn_batch_size: 50
  val_batch_size: 150
  cnn_weighted_loss: true
  sub_epoch_validation: 100
  input_size: 224
  feature_batch: 500
  pool_workers: 4
bdnet:
  blstm_epochs: 80
  blstm_lr: 8.0e-4
  ncl_lambda: 1.0e-3
  gamma: 0.3
  patience: 15
  reuse_catanet_cnn: false
