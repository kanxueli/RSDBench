# BD-Net (Wu et al., MICCAI 2022)
# Dataset overrides: configs/experiment/{cataract101,cholec80}_BDNet.yaml
model_name: BDNet
model:
  name: BDNet
  max_len: 40.0
  n_members: 5
  n_phases: 11
  n_experience: 2
  use_experience: false
  fps: 2.5
is_baseline: false
batch_size: 1
weight_decay: 0.0
stages:
  cnn_epochs: 20
  cnn_patience: 10
  cnn_lr: 1.0e-4
  cnn_batch_size: 50
  val_batch_size: 150
  cnn_weighted_loss: true
  sub_epoch_validation: 100
  input_size: 224
  feature_batch: 500
  pool_workers: 4
bdnet:
  blstm_epochs: 80
  blstm_lr: 8.0e-4
  ncl_lambda: 1.0e-3
  gamma: 0.3
  patience: 15
  reuse_catanet_cnn: false
