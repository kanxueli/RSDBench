# RSDNet (Twinanda et al., TMI 2019)
model_name: RSDNet
use_features: true
feat_loss: paper_rsdnet
model:
  name: RSDNet
  feature_size: 2048
  hidden_size: 512
  dropout: 0.3
  rsd_norm: 5.0
  max_len: 5.0
epochs: 80
lr: 1.0e-4
weight_decay: 0.0
batch_size: 1
grad_clip: 1.0
early_stopping:
  patience: 20
