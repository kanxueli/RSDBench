# Rivoir 2019
model_name: Rivoir2019
model:
  name: Rivoir2019
  embed_dim: 256
  hidden_size: 512
  n_subactivities: 10
  rsd_scale: 0.05
  dropout: 0.2
  pipeline: regularization
  use_corridor: true
  lambda_sub: 0.5
  seg_iters: 8
  seg_epochs: 5
  train_window: 384
  cnn_batch: 256
  batch_windows: 2
  steps_per_epoch: 200
  pretrained_cnn: true
  imagenet_norm: true
  pretrained_lr_mult: 0.1
  end_loss_gamma: 2.0
  end_window_bias: 0.5
  select_on: mae_5
  tc_epochs: 5
  tc_steps: 200
  tc_batch: 16
  tc_gap: 1
  tc_margin: 1.0
  tc_lambda_steady: 1.0
epochs: 200
lr: 1.0e-5
weight_decay: 1.0e-5
early_stopping:
  enabled: true
  monitor: mae_5
  patience: 20
