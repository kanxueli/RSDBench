# VTD-Net VT (Bodenstedt et al., IJCARS 2019)
model_name: VTDNet
model:
  name: VTDNet
  mode: VT
  n_tools: 7
  feature_size: 4096
  gru_hidden: 512
  fps: 1.0
is_baseline: false
batch_size: 1
epochs: 100
lr: 1.0e-4
vtd_loss: l1_rsd
weight_decay: 0.0
grad_clip: 0.0
early_stopping:
  enabled: true
  monitor: mae_all
  mode: min
  patience: 10
