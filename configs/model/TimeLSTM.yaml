# TimeLSTM (Aksamentov et al., MICCAI 2017)
model_name: TimeLSTM
use_features: true
feat_loss: paper_timelstm
test_smooth_window: 15
model:
  name: TimeLSTM
  feature_size: 2048
  hidden_size: 512
  max_len: 100.0
  n_phases: 7
epochs: 80
lr: 1.0e-4
weight_decay: 0.0
batch_size: 1
grad_clip: 1.0
early_stopping:
  patience: 20
